<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0c11" />
<title>StreamDeck — Video Hub</title>

<style>
  :root{
    --bg:#0a0c11;
    --surface:#12161f;
    --surface-2:#1a2030;
    --line:#242c3d;
    --text:#e8edf7;
    --muted:#8b96ad;
    --accent:#6d8cff;
    --accent-2:#22d3ee;
    --radius:16px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 600px at 8% -12%, rgba(109,140,255,.20), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.13), transparent 55%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{ overflow:hidden; }
  [hidden]{ display:none !important; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:18px;
    padding:14px clamp(16px,4vw,40px);
    background:rgba(10,12,17,.72);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .logo{
    width:40px; height:40px; flex:0 0 auto;
    border-radius:12px;
    display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 8px 24px -8px rgba(109,140,255,.9);
    color:#08101f; font-size:15px;
  }
  .brand h1{
    margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em;
    white-space:nowrap;
  }
  .brand p{ margin:2px 0 0; font-size:12px; color:var(--muted); }

  .search{ position:relative; flex:1; max-width:380px; }
  .search svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:.5; pointer-events:none;
  }
  .search input{
    width:100%; padding:11px 16px 11px 40px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text); font-size:14px; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input::placeholder{ color:#65708a; }
  .search input:focus{
    border-color:rgba(109,140,255,.75);
    box-shadow:0 0 0 4px rgba(109,140,255,.15);
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: clamp(12px, 1.6vw, 20px);
    padding: clamp(18px,3vw,32px) clamp(16px,4vw,40px) 70px;
  }

  .tile{
    position:relative;
    aspect-ratio: 1 / 1;          /* 👈 perfect squares */
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--surface);
    padding:0; margin:0;
    cursor:pointer;
    font:inherit; color:inherit; text-align:left;
    transition: transform .28s cubic-bezier(.2,.8,.3,1),
                border-color .28s, box-shadow .28s;
    isolation:isolate;
  }
  .tile:hover,
  .tile:focus-visible{
    transform: translateY(-5px) scale(1.02);
    border-color: rgba(109,140,255,.65);
    box-shadow: 0 22px 46px -22px rgba(109,140,255,.85);
    outline:none;
  }
  .tile:active{ transform: translateY(-2px) scale(1.0); }

  .thumb{
    position:absolute; inset:0;
    background: linear-gradient(135deg,
      hsl(var(--h), 68%, 44%),
      hsl(calc(var(--h) + 48), 72%, 24%));
    display:grid; place-items:center;
    overflow:hidden;
  }
  .thumb::after{
    content: attr(data-initials);
    font-size: clamp(24px, 4vw, 34px);
    font-weight:800;
    letter-spacing:.04em;
    color:rgba(255,255,255,.85);
    text-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .thumb img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    transition: transform .55s ease;
  }
  .tile:hover .thumb img{ transform: scale(1.09); }

  .badge{
    position:absolute; top:10px; left:10px; z-index:2;
    font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px);
    color:#dfe7f7;
  }

  .play{
    position:absolute; inset:0; margin:auto; z-index:2;
    width:56px; height:56px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(8px);
    opacity:0; transform: scale(.75);
    transition: opacity .25s, transform .25s;
    pointer-events:none;
  }
  .play svg{ width:20px; height:20px; fill:#fff; margin-left:3px; }
  .tile:hover .play,
  .tile:focus-visible .play{ opacity:1; transform: scale(1); }

  .meta{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:34px 12px 12px;
    background:linear-gradient(to top, rgba(0,0,0,.92) 12%, rgba(0,0,0,.55) 55%, transparent);
  }
  .meta .name{
    display:block;
    font-size:13px; font-weight:600; line-height:1.32;
    color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .empty{
    text-align:center; color:var(--muted); font-size:14px;
    padding:60px 20px;
  }

  /* ---------- PLAYER OVERLAY ---------- */
  .overlay{
    position:fixed; inset:0; z-index:100;
    display:grid; place-items:center;
    padding: clamp(10px, 3vw, 40px);
    background:rgba(5,7,11,.87);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fade .18s ease;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  @keyframes pop{
    from{ opacity:0; transform: translateY(14px) scale(.97); }
    to  { opacity:1; transform: none; }
  }

  .player{
    width:min(1220px, 100%);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 50px 120px -40px #000, 0 0 0 1px rgba(255,255,255,.03);
    animation: pop .28s cubic-bezier(.2,.9,.3,1.15);
  }
  .player-head{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px 12px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.035), transparent);
  }
  .dot{
    width:8px; height:8px; border-radius:50%; flex:0 0 auto;
    background:var(--accent-2);
    box-shadow:0 0 12px var(--accent-2);
  }
  .player-head h2{
    margin:0; font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:1;
  }

  /* popup blocker badge */
  .popup-shield{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:#9fb0d0;
    background:rgba(109,140,255,.15);
    border:1px solid rgba(109,140,255,.3);
    padding:4px 9px; border-radius:999px;
    white-space:nowrap; flex:0 0 auto;
    user-select:none;
  }
  .popup-shield svg{ width:12px; height:12px; fill:currentColor; }

  .icon-btn{
    flex:0 0 auto;
    width:34px; height:34px; border-radius:10px;
    display:grid; place-items:center;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text); font-size:15px; line-height:1;
    cursor:pointer;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .icon-btn:hover{ background:#232c40; border-color:rgba(109,140,255,.6); }
  .icon-btn:active{ transform:scale(.94); }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 9;
    max-height: calc(100dvh - 170px);
    background:#000;
  }
  .stage iframe,
  .stage video{
    width:100%; height:100%;
    border:0; display:block;
    background:#000;
  }

  /* loader */
  .loader{
    position:absolute; inset:0; margin:auto;
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--accent);
    animation: spin .8s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .stage .error{
    position:absolute; inset:0;
    display:grid; place-items:center; text-align:center;
    padding:24px; color:#ffb4b4; font-size:14px; line-height:1.6;
    background:#0a0c11;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 720px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (max-width: 640px){
    .topbar{ flex-wrap:wrap; }
    .search{ order:3; flex-basis:100%; max-width:none; }
    .player{ border-radius:14px; }
    .stage{ max-height: calc(100dvh - 150px); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="topbar">
  <div class="brand">
    <div class="logo">▶</div>
    <div>
      <h1>StreamDeck</h1>
      <p id="count">Loading…</p>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="Search library…" autocomplete="off" />
  </div>
</header>

<!-- ================= GRID ================= -->
<main>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>Nothing matches that search.</p>
</main>

<!-- ================= PLAYER OVERLAY ================= -->
<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Video player">
  <div class="player">
    <div class="player-head">
      <span class="dot"></span>
      <h2 id="playerTitle">Now playing</h2>

      <!-- popup blocker badge -->
      <span class="popup-shield" title="Popups and new tabs are blocked for your safety">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 4 5v6c0 5 3.4 9.3 8 10 4.6-.7 8-5 8-10V5l-8-3zm0 3.2 5 1.9v4.9c0 3.7-2.4 6.9-5 7.6-2.6-.7-5-3.9-5-7.6V7.1l5-1.9z"/>
          <path d="M12 8a2.5 2.5 0 0 0-2.5 2.5V12h-.5a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-.5v-1.5A2.5 2.5 0 0 0 12 8zm0 1.5a1 1 0 0 1 1 1V12h-2v-1.5a1 1 0 0 1 1-1z"/>
        </svg>
        Popups blocked
      </span>

      <button id="closeBtn" class="icon-btn" aria-label="Close player">✕</button>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<!-- HLS.js for .m3u8 playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<script>
/* =========================================================================
   👇👇  PASTE YOUR LINKS HERE  👇👇
   -------------------------------------------------------------------------
   title    : name shown on the tile                  (required)
   src      : the link                                 (required)
              • iframe embeds → use the EMBED url, e.g.
                https://www.youtube.com/embed/VIDEO_ID
                https://player.vimeo.com/video/123456
                https://www.dailymotion.com/embed/video/xxxxx
              • HLS streams   → https://example.com/live/stream.m3u8
              • plain video   → https://example.com/movie.mp4
   type     : "iframe" | "hls" | "video"   → optional, auto-detected
   thumb    : optional square image URL for the tile
   poster   : optional poster image for hls/video
   autoplay : optional, default true
   ========================================================================= */

const MEDIA = [

  {
        title: "Brewers vs Rays",
    src:   "https://admin2.formaturamaxi.com.br/mlb.m3u8",
    type:  "hls",
    thumb: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJGlfjkYp9mlChJHJlEk1EsxgJlmmCw7R9hOxplJpjr3qogec26p_dnrAj&s=10"
  },
{
    title: "Guadalajara vs Atlante",
    src:   "https://admin2.formaturamaxi.com.br/nba.m3u8",
    type:  "hls",
    thumb:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSY5mQ2ExGxxhwHi1xTa3x5UYUChOxQiXmi2gXB6YQ52gTp57fiSKNk_4_B&s=10"
  },

  {
    title: "Canal 5",
    src:   "https://thedaddy.pk/stream/stream-936.php",
    type:  "iframe",
    thumb: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0-q2jsWwaJwytmj2IuAkzwJnriVP3GqvWXzA81drC6A&s=10"
  },

  {
    title: "Azteca 7",
    src:   "https://thedaddy.pk/stream/stream-844.php",
    type:  "iframe",
    thumb: "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Logo_Azteca_7_2011.svg/1280px-Logo_Azteca_7_2011.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
  },


  /* ⬇️ keep adding objects here, separated by commas ⬇️ */
  // { title: "My Stream", src: "https://my.site/live.m3u8" },
];

/* =========================================================================
   POPUP BLOCKER (global, for this page's context)
   ========================================================================= */

/* 1) Override window.open for any scripts running on this page */
const _originalWindowOpen = window.open;
window.open = function (...args) {
  console.warn("StreamDeck: window.open blocked →", args[0]);
  return null;
};

/* 2) Intercept target="_blank" links inside our document */
document.addEventListener(
  "click",
  function (e) {
    const link = e.target.closest && e.target.closest('a[target="_blank"]');
    if (link) {
      e.preventDefault();
      console.warn("StreamDeck: new tab blocked →", link.href);
    }
  },
  true
);

/* =========================================================================
   Below this line = the engine. You normally don't need to touch it.
   ========================================================================= */

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);

const TYPE_LABEL = { iframe: "Embed", hls: "Live / HLS", video: "Video" };

function detectType(src, type) {
  if (type) return type.toLowerCase();
  const clean = String(src).split("?")[0].split("#")[0].toLowerCase();
  if (clean.endsWith(".m3u8") || clean.endsWith(".m3u")) return "hls";
  if (/\.(mp4|webm|ogv|ogg|m4v|mov)$/.test(clean)) return "video";
  return "iframe";
}

function hueFrom(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}

function initialsFrom(str) {
  const words = String(str).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "▶";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

/* ---------- build the grid ---------- */
const gridEl     = $("#grid");
const emptyEl    = $("#empty");
const countEl    = $("#count");
const searchEl   = $("#search");
const overlayEl  = $("#overlay");
const stageEl    = $("#stage");
const titleEl    = $("#playerTitle");
const closeBtn   = $("#closeBtn");

const tiles = [];

function buildGrid() {
  const frag = document.createDocumentFragment();

  MEDIA.forEach((item, index) => {
    const type = detectType(item.src, item.type);
    const title = item.title || "Untitled";

    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "tile";
    tile.dataset.title = title.toLowerCase();
    tile.dataset.index = index;
    tile.setAttribute("aria-label", "Play " + title);

    /* thumbnail / gradient fallback */
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.dataset.initials = initialsFrom(title);
    thumb.style.setProperty("--h", hueFrom(title));

    if (item.thumb) {
      const img = document.createElement("img");
      img.src = item.thumb;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("error", () => img.remove(), { once: true });
      thumb.appendChild(img);
    }

    /* badge */
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = TYPE_LABEL[type] || type;

    /* play icon */
    const play = document.createElement("span");
    play.className = "play";
    play.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

    /* title bar */
    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = title;
    meta.appendChild(name);

    tile.append(thumb, badge, play, meta);
    tile.addEventListener("click", () => openPlayer(item));

    frag.appendChild(tile);
    tiles.push(tile);
  });

  gridEl.appendChild(frag);
  updateCount(MEDIA.length);
}

function updateCount(n) {
  countEl.textContent = n + (n === 1 ? " item" : " items") + " in library";
}

/* ---------- search filter ---------- */
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;

  tiles.forEach((tile) => {
    const match = !q || tile.dataset.title.includes(q);
    tile.hidden = !match;
    if (match) visible++;
  });

  emptyEl.hidden = visible > 0;
  updateCount(visible);
});

/* ---------- player ---------- */
let activeHls = null;
let activeVideo = null;
let lastFocused = null;

function openPlayer(item) {
  closePlayer();

  lastFocused = document.activeElement;
  titleEl.textContent = item.title || "Now playing";
  overlayEl.hidden = false;
  document.body.classList.add("locked");

  const type = detectType(item.src, item.type);
  stageEl.innerHTML = "";

  if (type === "iframe") {
    /* ---------- embedded page / player (sandboxed, popups blocked) ---------- */
    const frame = document.createElement("iframe");
    frame.src = item.src;
    frame.title = item.title || "Embedded video";
    frame.setAttribute("allowfullscreen", "");

    /*
      🔒 POPUP BLOCKER FOR IFRAMES
      We deliberately OMIT `allow-popups` and `allow-top-navigation*`
      so window.open(), target="_blank" and top redirects are blocked.
      If a specific embed legitimately needs popups, add `allow-popups`
      to the string below for that one item only.
    */
    frame.setAttribute(
      "sandbox",
      [
        "allow-scripts",
        "allow-same-origin",
        "allow-forms",
        "allow-presentation",
        "allow-orientation-lock",
        "allow-pointer-lock"
        /* "allow-popups"  ← intentionally omitted */
      ].join(" ")
    );

    frame.setAttribute(
      "allow",
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    );
    frame.referrerPolicy = "no-referrer-when-downgrade";
    stageEl.appendChild(frame);

  } else {
    /* ---------- native <video> (hls or direct file) ---------- */
    const video = document.createElement("video");
    video.controls = true;
    video.autoplay = item.autoplay !== false;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    if (item.poster) video.poster = item.poster;

    /* spinner */
    const loader = document.createElement("div");
    loader.className = "loader";
    stageEl.append(video, loader);
    const killLoader = () => loader.remove();
    video.addEventListener("canplay", killLoader, { once: true });
    video.addEventListener("playing", killLoader, { once: true });
    setTimeout(killLoader, 9000);

    activeVideo = video;

    if (type === "hls") {
      attachHls(video, item.src);
    } else {
      video.src = item.src;
    }

    video.play().catch(() => { /* autoplay blocked → user presses play */ });
  }

  closeBtn.focus();
}

function attachHls(video, src) {
  if (window.Hls && window.Hls.isSupported()) {
    const hls = new window.Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90
    });

    hls.loadSource(src);
    hls.attachMedia(video);
    activeHls = hls;

    hls.on(window.Hls.Events.ERROR, (_evt, data) => {
      if (!data.fatal) return;
      if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
        hls.startLoad();
      } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        showError("This stream could not be loaded. It may be offline or blocked.");
        try { hls.destroy(); } catch (e) {}
        activeHls = null;
      }
    });

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    /* Safari / iOS native HLS */
    video.src = src;
  } else {
    showError("HLS playback is not supported in this browser.");
  }
}

function showError(message) {
  const box = document.createElement("div");
  box.className = "error";
  box.textContent = message;
  stageEl.appendChild(box);
}

function closePlayer() {
  if (activeHls) {
    try { activeHls.destroy(); } catch (e) {}
    activeHls = null;
  }
  if (activeVideo) {
    try {
      activeVideo.pause();
      activeVideo.removeAttribute("src");
      activeVideo.load();
    } catch (e) {}
    activeVideo = null;
  }

  stageEl.innerHTML = "";

  if (!overlayEl.hidden) {
    overlayEl.hidden = true;
    document.body.classList.remove("locked");
    if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
  }
}

/* ---------- overlay events ---------- */
closeBtn.addEventListener("click", closePlayer);

overlayEl.addEventListener("click", (e) => {
  if (e.target === overlayEl) closePlayer();   /* click outside → close */
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !overlayEl.hidden) closePlayer();
});

/* ---------- init ---------- */
