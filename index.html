<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0c11" />
<title>StreamDeck — Video Hub</title>

<style>
  :root{
    --bg:#0a0c11;
    --surface:#12161f;
    --surface-2:#1a2030;
    --line:#242c3d;
    --text:#e8edf7;
    --muted:#8b96ad;
    --accent:#6d8cff;
    --accent-2:#22d3ee;
    --radius:16px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 600px at 8% -12%, rgba(109,140,255,.20), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.13), transparent 55%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{ overflow:hidden; }
  [hidden]{ display:none !important; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:14px clamp(16px,4vw,40px);
    background:rgba(10,12,17,.72);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .logo{
    width:40px; height:40px; flex:0 0 auto;
    border-radius:12px;
    display:grid; place-items:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 8px 24px -8px rgba(109,140,255,.9);
    color:#08101f; font-size:15px;
  }
  .brand h1{ margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .brand p{ margin:2px 0 0; font-size:12px; color:var(--muted); }

  .search{ position:relative; flex:1; max-width:360px; }
  .search svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:.5; pointer-events:none;
  }
  .search input{
    width:100%; padding:11px 16px 11px 40px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text); font-size:14px; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input::placeholder{ color:#65708a; }
  .search input:focus{ border-color:rgba(109,140,255,.75); box-shadow:0 0 0 4px rgba(109,140,255,.15); }

  .topbar-actions{ display:flex; gap:8px; align-items:center; flex:0 0 auto; }

  .btn-primary{
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 15px; border-radius:10px; border:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#08101f; font:inherit; font-weight:700; font-size:13px;
    cursor:pointer;
    transition: transform .15s, box-shadow .2s;
    box-shadow:0 8px 20px -8px rgba(109,140,255,.8);
    white-space:nowrap;
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 12px 24px -10px rgba(109,140,255,.95); }
  .btn-primary:active{ transform:translateY(0); }
  .btn-primary svg{ flex:0 0 auto; }

  .menu-wrap{ position:relative; }
  .menu{
    position:absolute; top:calc(100% + 6px); right:0; z-index:30;
    min-width:210px; padding:6px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 20px 40px -12px #000;
    animation: pop .18s ease;
  }
  .menu button{
    display:block; width:100%; padding:9px 12px;
    text-align:left; font:inherit; font-size:13px;
    color:var(--text); background:transparent;
    border:none; border-radius:8px; cursor:pointer;
    transition:background .15s;
  }
  .menu button:hover{ background:var(--surface-2); }
  .menu button.danger{ color:#ff9a9a; }
  .menu button.danger:hover{ background:rgba(239,68,68,.15); }

  .icon-btn{
    flex:0 0 auto;
    width:34px; height:34px; border-radius:10px;
    display:grid; place-items:center;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text); font-size:15px; line-height:1;
    cursor:pointer;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .icon-btn:hover{ background:#232c40; border-color:rgba(109,140,255,.6); }
  .icon-btn:active{ transform:scale(.94); }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: clamp(12px, 1.6vw, 20px);
    padding: clamp(18px,3vw,32px) clamp(16px,4vw,40px) 70px;
  }

  .tile-wrap{
    position:relative;
    aspect-ratio: 1 / 1;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--surface);
    transition: transform .28s cubic-bezier(.2,.8,.3,1),
                border-color .28s, box-shadow .28s;
    isolation:isolate;
  }
  .tile-wrap:hover,
  .tile-wrap:focus-within{
    transform: translateY(-5px) scale(1.02);
    border-color: rgba(109,140,255,.65);
    box-shadow: 0 22px 46px -22px rgba(109,140,255,.85);
  }

  .tile{
    position:absolute; inset:0;
    padding:0; margin:0;
    border:none; background:transparent;
    cursor:pointer; font:inherit; color:inherit; text-align:left;
    overflow:hidden;
  }
  .tile:focus{ outline:none; }

  .thumb{
    position:absolute; inset:0;
    background: linear-gradient(135deg,
      hsl(var(--h), 68%, 44%),
      hsl(calc(var(--h) + 48), 72%, 24%));
    display:grid; place-items:center;
    overflow:hidden;
  }
  .thumb::after{
    content: attr(data-initials);
    font-size: clamp(24px, 4vw, 34px);
    font-weight:800; letter-spacing:.04em;
    color:rgba(255,255,255,.85);
    text-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .thumb img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    transition: transform .55s ease;
  }
  .tile-wrap:hover .thumb img{ transform: scale(1.09); }

  .badge{
    position:absolute; top:10px; left:10px; z-index:2;
    font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px);
    color:#dfe7f7;
  }

  .play{
    position:absolute; inset:0; margin:auto; z-index:2;
    width:56px; height:56px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(8px);
    opacity:0; transform: scale(.75);
    transition: opacity .25s, transform .25s;
    pointer-events:none;
  }
  .play svg{ width:20px; height:20px; fill:#fff; margin-left:3px; }
  .tile-wrap:hover .play,
  .tile-wrap:focus-within .play{ opacity:1; transform: scale(1); }

  .meta{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:34px 12px 12px;
    background:linear-gradient(to top, rgba(0,0,0,.92) 12%, rgba(0,0,0,.55) 55%, transparent);
  }
  .meta .name{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    font-size:13px; font-weight:600; line-height:1.32;
    color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }

  .tile-actions{
    position:absolute; top:8px; right:8px; z-index:6;
    display:flex; gap:5px;
    opacity:0; transform: translateY(-4px);
    transition: opacity .2s, transform .2s;
  }
  .tile-wrap:hover .tile-actions,
  .tile-wrap:focus-within .tile-actions{ opacity:1; transform:none; }

  .tile-action{
    width:28px; height:28px; border-radius:8px;
    border:1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(8px);
    color:#fff; font-size:13px;
    display:grid; place-items:center;
    cursor:pointer;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .tile-action:hover{ background: rgba(109,140,255,.85); border-color:rgba(255,255,255,.4); }
  .tile-action:active{ transform: scale(.92); }
  .tile-action.delete:hover{ background: rgba(239,68,68,.85); }

  .empty{
    text-align:center; color:var(--muted); font-size:14px;
    padding:60px 20px;
  }
  .empty p{ margin:0 0 14px; }
  .empty .btn-primary{ margin: 0 auto; }

  /* ---------- OVERLAYS ---------- */
  .overlay{
    position:fixed; inset:0; z-index:100;
    display:grid; place-items:center;
    padding: clamp(10px, 3vw, 40px);
    background:rgba(5,7,11,.87);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fade .18s ease;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  @keyframes pop{
    from{ opacity:0; transform: translateY(14px) scale(.97); }
    to  { opacity:1; transform: none; }
  }

  /* ---------- PLAYER ---------- */
  .player{
    width:min(1220px, 100%);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 50px 120px -40px #000, 0 0 0 1px rgba(255,255,255,.03);
    animation: pop .28s cubic-bezier(.2,.9,.3,1.15);
  }
  .player-head{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px 12px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.035), transparent);
  }
  .dot{
    width:8px; height:8px; border-radius:50%; flex:0 0 auto;
    background:var(--accent-2);
    box-shadow:0 0 12px var(--accent-2);
  }
  .player-head h2{
    margin:0; font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:1;
  }
  .popup-shield{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:#9fb0d0;
    background:rgba(109,140,255,.15);
    border:1px solid rgba(109,140,255,.3);
    padding:4px 9px; border-radius:999px;
    white-space:nowrap; flex:0 0 auto;
    user-select:none;
  }
  .popup-shield svg{ width:12px; height:12px; fill:currentColor; }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 9;
    max-height: calc(100dvh - 170px);
    background:#000;
  }
  .stage iframe,
  .stage video{
    width:100%; height:100%;
    border:0; display:block;
    background:#000;
  }

  .loader{
    position:absolute; inset:0; margin:auto;
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--accent);
    animation: spin .8s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .stage .error{
    position:absolute; inset:0;
    display:grid; place-items:center; text-align:center;
    padding:24px; color:#ffb4b4; font-size:14px; line-height:1.6;
    background:#0a0c11;
  }

  /* ---------- FORM MODAL ---------- */
  .form-card{
    width:min(520px, 100%);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 50px 120px -40px #000;
    animation: pop .28s cubic-bezier(.2,.9,.3,1.15);
  }
  .form-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .form-head h2{ margin:0; font-size:16px; font-weight:700; }
  .form-body{ padding:18px; display:flex; flex-direction:column; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field span{
    font-size:11px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.07em;
  }
  .field em{ font-style:normal; font-weight:400; text-transform:none; letter-spacing:0; opacity:.6; }
  .field input{
    padding:11px 14px;
    border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font:inherit; font-size:14px;
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus{
    border-color:rgba(109,140,255,.75);
    box-shadow:0 0 0 3px rgba(109,140,255,.15);
  }
  .type-hint{
    font-size:12px; color:var(--muted);
    padding:8px 12px;
    background:rgba(109,140,255,.08);
    border:1px dashed rgba(109,140,255,.25);
    border-radius:8px;
  }
  .type-hint b{ color:var(--accent-2); }
  .form-foot{
    display:flex; justify-content:flex-end; gap:10px;
    padding:14px 18px;
    border-top:1px solid var(--line);
    background:rgba(255,255,255,.015);
  }
  .btn-ghost{
    padding:9px 16px; border-radius:10px;
    border:1px solid var(--line);
    background:transparent; color:var(--text);
    font:inherit; font-size:13px; font-weight:600;
    cursor:pointer;
    transition: background .15s, border-color .15s;
  }
  .btn-ghost:hover{ background:var(--surface-2); border-color:rgba(109,140,255,.4); }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%;
    transform: translateX(-50%);
    z-index:300;
    padding:12px 20px;
    background: rgba(20,26,38,.95);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:13px; font-weight:500;
    color:var(--text);
    box-shadow: 0 20px 40px -12px #000;
    backdrop-filter: blur(12px);
    max-width: min(500px, 90vw);
    animation: toastIn .25s cubic-bezier(.2,.9,.3,1.1);
    pointer-events:none;
  }
  .toast.error{ color:#ffb4b4; border-color: rgba(239,68,68,.4); }
  .toast.hiding{ animation: toastOut .2s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(-50%) translateY(20px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(-50%) translateY(20px); } }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 720px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (max-width: 640px){
    .topbar{ flex-wrap:wrap; }
    .search{ order:3; flex-basis:100%; max-width:none; }
    .player{ border-radius:14px; }
    .form-card{ border-radius:14px; }
    .stage{ max-height: calc(100dvh - 150px); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="topbar">
  <div class="brand">
    <div class="logo">▶</div>
    <div>
      <h1>StreamDeck</h1>
      <p id="count">Loading…</p>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="Search library…" autocomplete="off" />
  </div>

  <div class="topbar-actions">
    <button class="btn-primary" id="addBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" aria-label="Library menu">⋯</button>
      <div class="menu" id="menu" hidden>
        <button data-action="export">Export library…</button>
        <button data-action="import">Import library…</button>
        <button data-action="clear" class="danger">Clear my custom items</button>
      </div>
    </div>
  </div>
</header>

<!-- ================= GRID ================= -->
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>Nothing here yet.</p>
    <button class="btn-primary" id="emptyAddBtn">+ Add your first video</button>
  </div>
</main>

<input type="file" id="importInput" accept=".json,application/json" hidden />

<!-- ================= PLAYER OVERLAY ================= -->
<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Video player">
  <div class="player">
    <div class="player-head">
      <span class="dot"></span>
      <h2 id="playerTitle">Now playing</h2>
      <span class="popup-shield" title="Popups and new tabs are blocked for your safety">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 4 5v6c0 5 3.4 9.3 8 10 4.6-.7 8-5 8-10V5l-8-3zm0 3.2 5 1.9v4.9c0 3.7-2.4 6.9-5 7.6-2.6-.7-5-3.9-5-7.6V7.1l5-1.9z"/>
          <path d="M12 8a2.5 2.5 0 0 0-2.5 2.5V12h-.5a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-.5v-1.5A2.5 2.5 0 0 0 12 8zm0 1.5a1 1 0 0 1 1 1V12h-2v-1.5a1 1 0 0 1 1-1z"/>
        </svg>
        Popups blocked
      </span>
      <button id="closeBtn" class="icon-btn" aria-label="Close player">✕</button>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<!-- ================= ADD / EDIT FORM ================= -->
<div id="formOverlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <form id="itemForm" class="form-card" autocomplete="off">
    <div class="form-head">
      <h2 id="formTitle">Add a video</h2>
      <button type="button" class="icon-btn" id="formClose" aria-label="Close">✕</button>
    </div>
    <div class="form-body">
      <label class="field">
        <span>Title</span>
        <input name="title" required maxlength="120" placeholder="e.g. My favorite stream" />
      </label>
      <label class="field">
        <span>Link (URL)</span>
        <input name="src" type="url" required placeholder="https://..." />
      </label>
      <label class="field">
        <span>Thumbnail URL <em>(optional)</em></span>
        <input name="thumb" type="url" placeholder="https://.../image.jpg" />
      </label>
      <label class="field">
        <span>Poster URL <em>(optional, video only)</em></span>
        <input name="poster" type="url" placeholder="https://.../poster.jpg" />
      </label>
      <div class="type-hint" id="typeHint">Type: <b>Embed</b></div>
    </div>
    <div class="form-foot">
      <button type="button" class="btn-ghost" id="formCancel">Cancel</button>
      <button type="submit" class="btn-primary" id="formSubmit">Add to library</button>
    </div>
  </form>
</div>

<!-- ================= TOAST ================= -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    thumb: "https://e00-xlk-ue-marca-en.uecdn.es/uploads/2026/10/29/6ae38504dc1ae.jpeg"
  },

];

/* =========================================================================
   POPUP BLOCKER (global)
   ========================================================================= */

const _originalWindowOpen = window.open;
window.open = function (...args) {
  console.warn("StreamDeck: window.open blocked →", args[0]);
  return null;
};

document.addEventListener("click", function (e) {
  const link = e.target.closest && e.target.closest('a[target="_blank"]');
  if (link) {
    e.preventDefault();
    console.warn("StreamDeck: new tab blocked →", link.href);
  }
}, true);

/* =========================================================================
   Storage layer — user items live in localStorage
   ========================================================================= */

const STORAGE_KEY = "streamdeck_user_items_v1";

function uid() {
  return "i_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
}

let userItems = [];
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) userItems = parsed;
  }
} catch (e) {
  console.warn("StreamDeck: could not read localStorage", e);
}

function saveUserItems() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userItems));
  } catch (e) {
    toast("Could not save — storage is full", "error");
  }
}

function combinedItems() {
  return [
    ...MEDIA.map(m => ({ ...m, _isDefault: true })),
    ...userItems.map(u => ({ ...u, _isDefault: false }))
  ];
}

/* =========================================================================
   Helpers
   ========================================================================= */

const $ = (s) => document.querySelector(s);

const TYPE_LABEL = { iframe: "Embed", hls: "Live / HLS", video: "Video" };

function detectType(src, type) {
  if (type) return String(type).toLowerCase();
  const clean = String(src).split("?")[0].split("#")[0].toLowerCase();
  if (clean.endsWith(".m3u8") || clean.endsWith(".m3u")) return "hls";
  if (/\.(mp4|webm|ogv|ogg|m4v|mov)$/.test(clean)) return "video";
  return "iframe";
}

function hueFrom(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}

function initialsFrom(str) {
  const words = String(str).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "▶";
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

/* =========================================================================
   Toasts
   ========================================================================= */

const toastEl = $("#toast");
let toastTimer;

function toast(msg, kind) {
  clearTimeout(toastTimer);
  toastEl.classList.remove("error", "hiding");
  if (kind === "error") toastEl.classList.add("error");
  toastEl.textContent = msg;
  toastEl.hidden = false;
  void toastEl.offsetWidth; // restart animation
  toastTimer = setTimeout(() => {
    toastEl.classList.add("hiding");
    setTimeout(() => { toastEl.hidden = true; toastEl.classList.remove("hiding"); }, 200);
  }, 2200);
}

/* =========================================================================
   Grid rendering
   ========================================================================= */

const gridEl  = $("#grid");
const emptyEl = $("#empty");
const countEl = $("#count");
const searchEl = $("#search");

let tileWraps = [];

function renderGrid() {
  gridEl.innerHTML = "";
  tileWraps = [];

  const items = combinedItems();

  if (!items.length) {
    emptyEl.hidden = false;
    updateCount(0);
    return;
  }
  emptyEl.hidden = true;

  const frag = document.createDocumentFragment();

  items.forEach((item) => {
    const type = detectType(item.src, item.type);
    const title = item.title || "Untitled";

    const wrap = document.createElement("div");
    wrap.className = "tile-wrap";
    wrap.dataset.title = title.toLowerCase();

    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "tile";
    tile.setAttribute("aria-label", "Play " + title);

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.dataset.initials = initialsFrom(title);
    thumb.style.setProperty("--h", hueFrom(title));

    if (item.thumb) {
      const img = document.createElement("img");
      img.src = item.thumb;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("error", () => img.remove(), { once: true });
      thumb.appendChild(img);
    }

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = TYPE_LABEL[type] || type;

    const play = document.createElement("span");
    play.className = "play";
    play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = title;
    meta.appendChild(name);

    tile.append(thumb, badge, play, meta);
    tile.addEventListener("click", () => openPlayer(item));

    wrap.appendChild(tile);

    // Action buttons only for user items
    if (!item._isDefault) {
      const actions = document.createElement("div");
      actions.className = "tile-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "tile-action";
      editBtn.title = "Edit";
      editBtn.setAttribute("aria-label", "Edit " + title);
      editBtn.textContent = "✎";
      editBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openForm(item);
      });

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "tile-action delete";
      delBtn.title = "Delete";
      delBtn.setAttribute("aria-label", "Delete " + title);
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteItem(item._id);
      });

      actions.append(editBtn, delBtn);
      wrap.appendChild(actions);
    }

    frag.appendChild(wrap);
    tileWraps.push(wrap);
  });

  gridEl.appendChild(frag);
  updateCount(items.length);
  applyFilter();
}

function updateCount(n) {
  countEl.textContent = n + (n === 1 ? " item" : " items") + " in library";
}

function applyFilter() {
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;

  tileWraps.forEach((wrap) => {
    const match = !q || wrap.dataset.title.includes(q);
    wrap.hidden = !match;
    if (match) visible++;
  });

  emptyEl.hidden = visible > 0;
  if (visible > 0) {
    updateCount(tileWraps.length);
  } else {
    countEl.textContent = "0 matches";
  }
}

searchEl.addEventListener("input", applyFilter);

/* =========================================================================
   Player
   ========================================================================= */

const overlayEl = $("#overlay");
const stageEl   = $("#stage");
const titleEl   = $("#playerTitle");
const closeBtn  = $("#closeBtn");

let activeHls = null;
let activeVideo = null;
let lastFocused = null;

function openPlayer(item) {
  closePlayer();

  lastFocused = document.activeElement;
  titleEl.textContent = item.title || "Now playing";
  overlayEl.hidden = false;
  document.body.classList.add("locked");

  const type = detectType(item.src, item.type);
  stageEl.innerHTML = "";

  if (type === "iframe") {
    const frame = document.createElement("iframe");
    frame.src = item.src;
    frame.title = item.title || "Embedded video";
    frame.setAttribute("allowfullscreen", "");
    frame.setAttribute(
      "sandbox",
      ["allow-scripts","allow-same-origin","allow-forms","allow-presentation",
       "allow-orientation-lock","allow-pointer-lock"].join(" ")
    );
    frame.setAttribute(
      "allow",
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    );
    frame.referrerPolicy = "no-referrer-when-downgrade";
    stageEl.appendChild(frame);

  } else {
    const video = document.createElement("video");
    video.controls = true;
    video.autoplay = item.autoplay !== false;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    if (item.poster) video.poster = item.poster;

    const loader = document.createElement("div");
    loader.className = "loader";
    stageEl.append(video, loader);
    const killLoader = () => loader.remove();
    video.addEventListener("canplay", killLoader, { once: true });
    video.addEventListener("playing", killLoader, { once: true });
    setTimeout(killLoader, 9000);

    activeVideo = video;

    if (type === "hls") attachHls(video, item.src);
    else video.src = item.src;

    video.play().catch(() => {});
  }

  closeBtn.focus();
}

function attachHls(video, src) {
  if (window.Hls && window.Hls.isSupported()) {
    const hls = new window.Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 90 });
    hls.loadSource(src);
    hls.attachMedia(video);
    activeHls = hls;

    hls.on(window.Hls.Events.ERROR, (_evt, data) => {
      if (!data.fatal) return;
      if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else {
        showError("This stream could not be loaded. It may be offline or blocked.");
        try { hls.destroy(); } catch (e) {}
        activeHls = null;
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = src;
  } else {
    showError("HLS playback is not supported in this browser.");
  }
}

function showError(message) {
  const box = document.createElement("div");
  box.className = "error";
  box.textContent = message;
  stageEl.appendChild(box);
}

function closePlayer() {
  if (activeHls) { try { activeHls.destroy(); } catch (e) {} activeHls = null; }
  if (activeVideo) {
    try {
      activeVideo.pause();
      activeVideo.removeAttribute("src");
      activeVideo.load();
    } catch (e) {}
    activeVideo = null;
  }
  stageEl.innerHTML = "";
  if (!overlayEl.hidden) {
    overlayEl.hidden = true;
    if (formOverlay.hidden) document.body.classList.remove("locked");
    if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
  }
}

closeBtn.addEventListener("click", closePlayer);
overlayEl.addEventListener("click", (e) => { if (e.target === overlayEl) closePlayer(); });

/* =========================================================================
   Add / Edit form
   ========================================================================= */

const formOverlay = $("#formOverlay");
const itemForm    = $("#itemForm");
const formTitle   = $("#formTitle");
const formSubmit  = $("#formSubmit");
const typeHint    = $("#typeHint");

let editingId = null;

function openForm(item) {
  editingId = item ? item._id : null;

  formTitle.textContent   = item ? "Edit video" : "Add a video";
  formSubmit.textContent  = item ? "Save changes" : "Add to library";

  itemForm.elements.title.value  = item?.title  || "";
  itemForm.elements.src.value    = item?.src    || "";
  itemForm.elements.thumb.value  = item?.thumb  || "";
  itemForm.elements.poster.value = item?.poster || "";

  updateTypeHint();

  closePlayer();
  formOverlay.hidden = false;
  document.body.classList.add("locked");
  setTimeout(() => itemForm.elements.title.focus(), 50);
}

function closeForm() {
  formOverlay.hidden = true;
  if (overlayEl.hidden) document.body.classList.remove("locked");
  editingId = null;
}

function updateTypeHint() {
  const src = itemForm.elements.src.value.trim();
  const t = src ? detectType(src, null) : "iframe";
  typeHint.innerHTML = "Type: <b>" + (TYPE_LABEL[t] || t) + "</b>";
}

itemForm.elements.src.addEventListener("input", updateTypeHint);

itemForm.addEventListener("submit", (e) => {
  e.preventDefault();

  const data   = new FormData(itemForm);
  const title  = String(data.get("title")  || "").trim();
  const src    = String(data.get("src")    || "").trim();
  const thumb  = String(data.get("thumb")  || "").trim();
  const poster = String(data.get("poster") || "").trim();

  if (!title || !src) { toast("Title and link are required", "error"); return; }

  try { new URL(src); }
  catch { toast("Please enter a valid URL", "error"); return; }

  if (editingId) {
    const idx = userItems.findIndex(x => x._id === editingId);
    if (idx >= 0) {
      userItems[idx] = {
        ...userItems[idx],
        title, src,
        thumb:  thumb  || undefined,
        poster: poster || undefined
      };
      toast("Saved changes");
    }
  } else {
    userItems.push({
      _id: uid(),
      title, src,
      thumb:  thumb  || undefined,
      poster: poster || undefined
    });
    toast("Added to library");
  }

  saveUserItems();
  renderGrid();
  closeForm();
});

$("#formClose").addEventListener("click", closeForm);
$("#formCancel").addEventListener("click", closeForm);

function deleteItem(id) {
  if (!confirm("Remove this video from your library?")) return;
  userItems = userItems.filter(x => x._id !== id);
  saveUserItems();
  renderGrid();
  toast("Removed");
}

/* =========================================================================
   Library menu: export / import / clear
   ========================================================================= */

const menuBtn  = $("#menuBtn");
const menuEl   = $("#menu");
const importInput = $("#importInput");

menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  menuEl.hidden = !menuEl.hidden;
});

document.addEventListener("click", (e) => {
  if (!menuEl.hidden && !menuEl.contains(e.target) && e.target !== menuBtn) {
    menuEl.hidden = true;
  }
});

menuEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  menuEl.hidden = true;

  if (action === "export") exportLibrary();
  else if (action === "import") importInput.click();
  else if (action === "clear") {
    if (!userItems.length) { toast("You don't have any custom items"); return; }
    if (!confirm("Clear all custom items? Defaults from code will remain.")) return;
    userItems = [];
    saveUserItems();
    renderGrid();
    toast("Custom items cleared");
  }
});

function exportLibrary() {
  const payload = {
    version: 1,
    exported: new Date().toISOString(),
    items: combinedItems().map(({ _isDefault, ...rest }) => rest)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "streamdeck-library.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Library exported");
}

importInput.addEventListener("change", () => {
  const file = importInput.files && importInput.files[0];
  if (file) importLibrary(file);
  importInput.value = "";
});

function importLibrary(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const raw = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(raw)) throw new Error("File does not contain an items array");

      const cleaned = raw
        .filter(x => x && typeof x.title === "string" && typeof x.src === "string")
        .map(x => ({
          _id: uid(),
          title: x.title.trim(),
          src:   x.src.trim(),
          thumb:  typeof x.thumb  === "string" && x.thumb  ? x.thumb  : undefined,
          poster: typeof x.poster === "string" && x.poster ? x.poster : undefined
        }));

      if (!cleaned.length) throw new Error("No valid items found");

      userItems = cleaned;
      saveUserItems();
      renderGrid();
      toast("Imported " + cleaned.length + " item" + (cleaned.length === 1 ? "" : "s"));
    } catch (err) {
      toast("Import failed: " + err.message, "error");
    }
  };
  reader.readAsText(file);
}

/* =========================================================================
   Buttons & keyboard
   ========================================================================= */

$("#addBtn").addEventListener("click", () => openForm(null));
$("#emptyAddBtn").addEventListener("click", () => openForm(null));

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!formOverlay.hidden) { closeForm(); return; }
  if (!overlayEl.hidden)   { closePlayer(); }
});

/* =========================================================================
   Init
   ========================================================================= */

renderGrid();
</script>
</body>
</html>
